backend:
  name: git-gateway
  branch: main

# Only people invited through Netlify Identity (the owner) can log in here.
# Nobody else can create an account or edit content.

media_folder: "content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "profile"
    label: "Profile (Name, Bio, Skills, Stats, Interests)"
    files:
      - name: "profile"
        label: "Profile"
        file: "content/profile.json"
        fields:
          - { label: "Full Name", name: "name", widget: "string" }
          - label: "Short Description (under your name)"
            name: "hero_desc"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Arabic", name: "ar", widget: "text" }
          - label: "About Me (long bio)"
            name: "about_text"
            widget: "object"
            fields:
              - { label: "English", name: "en", widget: "text" }
              - { label: "Arabic", name: "ar", widget: "text" }
          - label: "Roles / Titles (shown under your name)"
            name: "roles"
            widget: "list"
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Arabic", name: "ar", widget: "string", required: false }
              - { label: "Or fixed text in any language (overrides EN/AR)", name: "fr", widget: "string", required: false }
          - label: "Skills"
            name: "skills"
            widget: "list"
            fields:
              - { label: "Skill name (English)", name: "name_en", widget: "string" }
              - { label: "Skill name (Arabic)", name: "name_ar", widget: "string", required: false }
              - { label: "Percentage (0-100)", name: "percent", widget: "number", min: 0, max: 100 }
          - label: "Stats (Push Ups, Squats, etc.)"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Value (e.g. 40 or 28 km/h)", name: "value", widget: "string" }
              - { label: "Label (English)", name: "label_en", widget: "string" }
              - { label: "Label (Arabic)", name: "label_ar", widget: "string", required: false }
          - label: "Interests"
            name: "interests"
            widget: "list"
            fields:
              - { label: "English", name: "en", widget: "string" }
              - { label: "Arabic", name: "ar", widget: "string", required: false }

  - name: "gallery"
    label: "Gallery (Photos, Videos & Audio)"
    files:
      - name: "gallery"
        label: "Gallery Items"
        file: "content/gallery.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - label: "Type"
                name: "type"
                widget: "select"
                options: ["photo", "video", "audio"]
              - { label: "Photo (upload)", name: "image", widget: "image", required: false, hint: "Only used when Type = photo" }
              - { label: "Video embed URL (e.g. https://www.youtube.com/embed/VIDEO_ID)", name: "video_url", widget: "string", required: false, hint: "Only used when Type = video" }
              - { label: "Audio file (upload)", name: "audio_file", widget: "file", required: false, hint: "Only used when Type = audio" }

  - name: "notes"
    label: "Notes"
    files:
      - name: "notes"
        label: "Notes"
        file: "content/notes.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
              - { label: "Date", name: "date", widget: "datetime", required: false }

  - name: "places"
    label: "Places"
    files:
      - name: "places"
        label: "Places"
        file: "content/places.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Google Maps link", name: "map_url", widget: "string", required: false }
